    .topbar h1 { margin: 0; font-size: 19px; line-height: 1.2; }

      padding: 16px;

    .card h2 { font-size: 21px; }
    .card h3 { font-size: 17px; }
    .card h4 { font-size: 14px; }
    .stat { display: grid; gap: 7px; min-height: 104px; }
    .stat .num { font-size: 30px; font-weight: 920; color: var(--accent); line-height: 1; }
    .stat .label { font-size: 12px; color: var(--muted); font-weight: 780; }

    .primary-btn { background: var(--accent); color: #fff; box-shadow: 0 12px 24px rgba(15,111,134,.22); }
    .soft-btn { background: rgba(15,111,134,.10); color: var(--accent); border: 1px solid rgba(15,111,134,.22); }
    .ghost-btn { background: var(--input); color: var(--text); border: 1px solid var(--line); }
    .danger-btn { background: rgba(177,50,58,.12); color: var(--red); border: 1px solid rgba(177,50,58,.28); }
    .list { display:grid; gap:10px; }
    .row {

    .row-title { font-size: 16px; font-weight: 880; margin: 0; }
    .row-meta { display:flex; gap:7px; align-items:center; flex-wrap:wrap; }
    .person-picker { display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap:8px; }
    .person-picker.is-empty { display:block; padding:10px 11px; border:1px dashed var(--line); border-radius:10px; background:var(--input); }
    .person-option {
      min-height:48px;

      align-items:flex-start;
      gap:8px;
      padding:9px 10px;
      border:1px solid var(--line);
      border-radius:10px;
      background:var(--input);

    .person-option input { width:18px; height:18px; margin:2px 0 0; accent-color:var(--accent); flex:0 0 auto; }

      .brand-mark { width:56px; height:56px; border-radius:16px; }

      .brand-title { font-size:14px; }
      .nav { display:flex; overflow:auto; padding-bottom:2px; }
      .nav button { white-space:nowrap; }
      .sidebar-footer { display:none; }
      .main { grid-column:1; padding:14px; }
      .topbar { align-items:flex-start; }

      .topbar > .row-meta { display:flex; justify-content:flex-start; }
      .profile-select { grid-column:1/-1; width:100%; min-width:0; }

      .recovery-row { grid-template-columns:1fr; }
      .step-row { grid-template-columns: 30px minmax(0,1fr); }
      .step-row > div:nth-child(n+3) { grid-column: 2; }
    }
  </style>

function addDays(date, days){
  if(!date) return '';
  const d = new Date(date + 'T00:00:00');
  if(Number.isNaN(d.getTime())) return '';
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0,10);
}
function addWorkdays(date, days){
  if(!date) return '';
  const d = new Date(date + 'T00:00:00');
  if(Number.isNaN(d.getTime())) return '';
  let added = 0;
  while(added < days){
    d.setDate(d.getDate() + 1);
    const day = d.getDay();
    if(day !== 0 && day !== 6) added++;
  }
  return d.toISOString().slice(0,10);
}
function recalcProjectSteps(project){

      if(s && s.completedAt) completedByAnchor[tpl.anchor] = s.completedAt;
    }
  });
  project.steps = normalizeSteps(project.steps, project.complexity === 'complex').map(step=>{
    const tpl = STEP_TEMPLATES.find(t=>t.key===step.key);
    if(tpl && tpl.after && completedByAnchor[tpl.after]){

        const days = project.complexity === 'complex' && tpl.complexDays ? tpl.complexDays : tpl.days;

  });

function buildStateFromRows({ profiles, plans, rounds, projects, steps }){
  const next = normalizeState({ profiles:profiles.map(profileFromRow), plans:plans.map(planFromRow), createdAt:new Date().toISOString(), updatedAt:new Date().toISOString() });
  const planById = new Map(next.plans.map(plan=>[plan.id, plan]));
  const roundById = new Map();
  rounds.map(roundFromRow).forEach(round=>{
    const plan = planById.get(round.planId);
    if(plan){ plan.rounds.push(round); roundById.set(round.id, round); }
  });
  const projectById = new Map();
  projects.map(projectFromRow).forEach(project=>{
    const round = roundById.get(project.roundId);
    if(round){ round.projects.push(project); projectById.set(project.id, project); }
  });
  const stepsByProject = new Map();
  steps.forEach(row=>{
    const step = stepFromRow(row);
    if(!stepsByProject.has(row.project_id)) stepsByProject.set(row.project_id, []);
    stepsByProject.get(row.project_id).push(step);
  });
  projectById.forEach(project=>{
    project.steps = normalizeSteps(stepsByProject.get(project.id) || [], project.complexity === 'complex');
  });
  return normalizeState(next);
}
async function fetchRows(table, order='created_at', ascending=true){
  let query = db.from(table).select('*');
  if(order) query = query.order(order, { ascending });
  const { data, error } = await query;
  if(error) throw error;
  return data || [];
}
async function upsertRows(table, rows, onConflict='id'){
  if(!rows.length) return;
  const { error } = await db.from(table).upsert(rows, { onConflict });
  if(error) throw error;
}
async function updateRowsById(table, rows){
  if(!rows.length) return;
  for(const row of rows){
    const { id, ...changes } = row;
    const { error } = await db.from(table).update(changes).eq('id', id);
    if(error) throw error;
  }
}
function dbErrorText(error){
  if(!error) return '';
  return [error.message, error.details, error.hint, error.code].filter(Boolean).join(' | ');
}
async function deleteRows(table, column='id'){
  const { error } = await db.from(table).delete().neq(column, '');
  if(error) throw error;
}
async function deleteRowById(table, id){
  if(!db || !currentUser || !id) return;
  const { error } = await db.from(table).delete().eq('id', id);
  if(error) throw error;
}
async function ensureRemoteProfile(initialRows){
  const email = currentEmail();
  if(!email) return initialRows || [];
  const rows = initialRows || [];
  if(rows.some(row=>normalizeEmail(row.email) === email)) return rows;
  const role = rows.length ? 'member' : 'admin';
  const meta = currentUser.user_metadata || {};
  const profile = {
    id: currentUser.id || uid(),
    auth_user_id: authIdOrNull(currentUser.id),
    email,
    name: meta.full_name || meta.name || email.split('@')[0],
    role,
    created_at: new Date().toISOString()
  };
  const { error } = await db.from(TABLES.profiles).insert(profile);
  if(error && error.code !== '23505') throw error;
  return fetchRows(TABLES.profiles);
}
async function loadRemoteState(){
  const profileRows = await ensureRemoteProfile(await fetchRows(TABLES.profiles));
  remoteHasChief = profileRows.some(row=>row.role === 'chief');
  const [planRows, roundRows, projectRows, stepRows] = await Promise.all([
    fetchRows(TABLES.plans, 'created_at', false),
    fetchRows(TABLES.rounds, 'created_at', false),
    fetchRows(TABLES.projects, 'created_at', false),
    fetchRows(TABLES.steps, 'step_order', true)
  ]);
  return buildStateFromRows({ profiles:profileRows, plans:planRows, rounds:roundRows, projects:projectRows, steps:stepRows });
}
async function persistRemoteState(){
  if(!db || !currentUser) return;
  const canBootstrapSaveProfiles = isRemoteBootstrapAdmin();
  if(isChief() || canBootstrapSaveProfiles){
    const profileRows = canBootstrapSaveProfiles
      ? state.profiles.filter(p=>p.role === 'chief').map(profileToRow)
      : state.profiles.filter(p=>p.role !== 'admin').map(profileToRow);
    await upsertRows(TABLES.profiles, profileRows);
    remoteHasChief = state.profiles.some(p=>p.role === 'chief');
  }
  if(isChief()){
    await upsertRows(TABLES.plans, state.plans.map(planToRow));
  }
  const editableRounds = allRounds().filter(({round})=>canEditRound(round));
  const roundRows = editableRounds.map(({plan, round})=>roundToRow(round, plan.id));
  if(isChief()) await upsertRows(TABLES.rounds, roundRows);
  else await updateRowsById(TABLES.rounds, roundRows);
  const editableProjects = allProjects().filter(({round, project})=>canEditProject(round, project));
  const projectRowsForUpsert = editableProjects.filter(({round})=>canAssignProjectMembers(round)).map(({round, project})=>projectToRow(project, round.id));
  const projectRowsForUpdate = editableProjects.filter(({round})=>!canAssignProjectMembers(round)).map(({round, project})=>projectToRow(project, round.id));
  await upsertRows(TABLES.projects, projectRowsForUpsert);
  await updateRowsById(TABLES.projects, projectRowsForUpdate);
  await upsertRows(TABLES.steps, editableProjects.flatMap(({project})=>(project.steps || []).map(step=>stepToRow(step, project.id))), 'project_id,key');
}

async function loadState(){
  loading = true;
  render();
  if(!supabaseConfigured()){
    loading = false;
    statusOk = false;
    statusText = 'Chưa cấu hình Supabase mới.';
    render();
    return;
  }
  if(!currentUser){
    loading = false;
    statusOk = true;
    statusText = 'Vui lòng đăng nhập bằng tài khoản nội bộ.';
    render();
    return;
  }
  try{
    state = await loadRemoteState();
    ensureProfile();
    if(isBootstrapAdmin()) view = 'staff';
    loading = false;
    statusOk = true;
    statusText = 'Đã tải dữ liệu từ Supabase.';
    await saveState({ silent:true });
  }catch(e){
    console.error(e);
    loading = false;
    statusOk = false;
    statusText = 'Không tải được dữ liệu Supabase. Kiểm tra URL/key hoặc chạy lại supabase_schema.sql.';
  }
  render();
}
async function saveState(options={}){
  state.updatedAt = new Date().toISOString();
  if(options.debounce){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(()=>saveState({ silent:options.silent }), 550);
    return;
  }
  try{
    saving = true;
    if(!options.silent) renderSaveStatus();
    await persistRemoteState();
    statusOk = true;
    statusText = 'Đã lưu lên Supabase.';
  }catch(e){
    console.error(e);
    statusOk = false;
    const detail = dbErrorText(e);
    statusText = 'Không lưu được dữ liệu lên Supabase.';
    if(detail) statusText += ' ' + detail;
  }finally{
    saving = false;
    if(!options.silent) renderSaveStatus();
  }
}
function renderSaveStatus(){
  const el = document.getElementById('saveStatus');
  if(el) el.innerHTML = saveStatusHtml();
}
function saveStatusHtml(){
  return `<span class="${statusOk?'status-ok':'status-bad'}"><i class="ti ti-${saving?'loader-2':'cloud-check'}"></i> ${esc(saving?'Đang lưu...':statusText)}</span>`;
}

function authErrorMessage(error){
  const message = error && error.message ? String(error.message) : '';
  const lower = message.toLowerCase();
  if(lower.includes('already') || lower.includes('registered') || lower.includes('exists')){
    return 'Tài khoản này đã tồn tại. Chuyển sang Đăng nhập và dùng đúng mật khẩu.';
  }
  if(lower.includes('signup') && (lower.includes('disabled') || lower.includes('not allowed'))){
    return 'Supabase đang tắt tạo tài khoản mới. Vào Supabase > Authentication > Providers > Email và bật Allow new users to sign up.';
  }
  if(lower.includes('password')){
    return 'Mật khẩu chưa đạt yêu cầu Supabase. Dùng ít nhất 6 ký tự, nên có chữ và số.';
  }
  if(lower.includes('email')){
    return 'Email chưa hợp lệ hoặc Supabase chưa bật Email provider.';
  }
  if(lower.includes('database error')){
    return 'Supabase báo lỗi khi tạo user. Kiểm tra project có đang dùng trigger Auth cũ không, hoặc chạy lại supabase_schema.sql của web Thanh tra.';
  }
  return message || 'Kiểm tra lại cấu hình Supabase Auth.';
}

      }
    });

      currentUser = data.session.user;
      authMessage = '';
      await loadState();
      return;
    }
    authMode = 'login';

    render();
  }catch(e){
    const friendly = authErrorMessage(e);
    if(friendly.startsWith('Tài khoản này đã tồn tại')){
      authMode = 'login';
      authMessage = friendly;
    }else{
      authMessage = 'Tạo tài khoản thất bại: ' + friendly;
    }
    render();
  }
}

function seededRandom(seed){
  let value = seed % 2147483647;
  return ()=>{
    value = value * 16807 % 2147483647;
    return (value - 1) / 2147483646;
  };
}
function pickSample(list, index){
  return list[index % list.length];
}
function sampleProfileEmails(role, count, offset=0){
  const people = state.profiles.filter(p=>p.role === role).map(p=>normalizeEmail(p.email)).filter(Boolean);
  if(!people.length) return [];
  return Array.from({ length:count }, (_,i)=>people[(offset + i) % people.length]);
}
function applySampleWorkflow(project, baseDate, rnd){
  const target = 0.25 + rnd() * 0.68;
  project.steps = normalizeSteps([], project.complexity === 'complex').map((step, index)=>{
    const dueDate = addDays(baseDate, 5 + index * 5 + Math.floor(rnd() * 4));
    const completed = rnd() < target || index < Math.floor(target * 5);
    return {
      ...step,
      dueDate,
      completed,
      completedAt:completed ? addDays(dueDate, -Math.floor(rnd() * 3)) : '',
      docNo:completed ? `VB-${String(index + 1).padStart(2,'0')}/${new Date().getFullYear()}` : '',
      ownerEmail:project.memberEmails[index % Math.max(1, project.memberEmails.length)] || '',
      notes:completed ? 'Đã cập nhật hồ sơ, tài liệu liên quan.' : (rnd() > .55 ? 'Đang theo dõi, chờ bổ sung tài liệu.' : '')
    };
  });
}

        project.financialRecovery = normalizeMoney({ required, recoveryPayments });
        project.reportText = `Dự án đã được kiểm tra theo hồ sơ mẫu. Đoàn thanh tra ghi nhận ${project.findings.length} nội dung sai phạm/thiếu sót và ${project.recommendations.length} kiến nghị xử lý.`;
        project.conclusionSummary = `Kiến nghị thu hồi ${moneyText(required)}, đã ghi nhận ${project.financialRecovery.recoveryPayments.length} đợt thu hồi.`;
        applySampleWorkflow(project, round.startDate || plan.issuedDate, rnd);
        return project;
      });
      return round;
    });
    return plan;
  });
}

function reportProjects(rounds){
  return (rounds || []).flatMap(round=>visibleProjectsForRound(round).map(project=>({ round, project })));
}
function reportProjectItems(groups){
  return (groups || []).flatMap(({plan, rounds})=>
    (rounds || []).flatMap(round=>visibleProjectsForRound(round).map(project=>({ plan, round, project })))
  );
}
function ensureReportSelection(plans=visiblePlans()){
  const validPlanIds = new Set(plans.map(p=>p.id));
  reportPlanIds = new Set([...reportPlanIds].filter(id=>validPlanIds.has(id)));
  if(!reportSelectionInitialized && plans.length){
    plans.forEach(plan=>reportPlanIds.add(plan.id));
  }

  const selectedPlans = plans.filter(plan=>reportPlanIds.has(plan.id));
  const validRoundIds = new Set(selectedPlans.flatMap(plan=>visibleRounds(plan).map(round=>round.id)));
  reportRoundIds = new Set([...reportRoundIds].filter(id=>validRoundIds.has(id)));
  if(!reportSelectionInitialized && plans.length){
    selectedPlans.forEach(plan=>visibleRounds(plan).forEach(round=>reportRoundIds.add(round.id)));
    reportSelectionInitialized = true;
  }

  if(reportPlanId && !validPlanIds.has(reportPlanId)) reportPlanId = '';
  const singlePlan = (reportPlanId ? plans.find(p=>p.id===reportPlanId) : null) || selectedPlans[0] || plans[0] || null;
  if(singlePlan && reportPlanId !== singlePlan.id) reportPlanId = singlePlan.id;
  const singleRounds = singlePlan ? visibleRounds(singlePlan) : [];
  if(!singleRounds.some(round=>round.id===reportSingleRoundId)) reportSingleRoundId = singleRounds[0]?.id || '';
}
function selectedReportGroups(plans=visiblePlans()){
  ensureReportSelection(plans);
  return plans
    .filter(plan=>reportPlanIds.has(plan.id))
    .map(plan=>({ plan, rounds:visibleRounds(plan).filter(round=>reportRoundIds.has(round.id)) }));
}
function reportMetrics(projectItems){
  const projects = projectItems.map(x=>x.project);
  const workflow = average(projects.map(projectProgress));
  const text = average(projects.map(textIssueProgress));
  const financialProjects = projects.filter(p=>moneyNumber(normalizeMoney(p.financialRecovery).required) > 0);
  const financial = average(financialProjects.map(p=>recoveryPercent(p.financialRecovery)));
  const required = projects.reduce((sum,p)=>sum + moneyNumber(normalizeMoney(p.financialRecovery).required), 0);
  const recovered = projects.reduce((sum,p)=>sum + moneyNumber(normalizeMoney(p.financialRecovery).recovered), 0);
  return { workflow, text, financial, required, recovered, remaining:required - recovered, issueProjects:projects.filter(hasIssueContent).length, projects:projects.length };
}
function reportItemsForRound(plan, round){
  return visibleProjectsForRound(round).map(project=>({ plan, round, project }));
}
function reportProgressRow(type, label, detail, projectItems){
  return { type, label, detail, projectItems, metrics:reportMetrics(projectItems) };
}
function buildReportProgressContext(groups, options={}){
  const usableGroups = (groups || []).map(group=>({ plan:group.plan, rounds:group.rounds || [] })).filter(group=>group.plan && group.rounds.length);
  const singlePlan = options.singlePlan || null;
  const singleRound = options.singleRound || null;
  if(reportChartScope === 'single-round' && singlePlan && singleRound){
    const projectItems = reportItemsForRound(singlePlan, singleRound);
    const rows = projectItems.map(({plan, round, project})=>reportProgressRow(
      'project',
      project.name || 'Dự án',
      `${round.code || round.name || 'Cuộc thanh tra'} - ${plan.code || plan.name || 'Kế hoạch'}`,
      [{ plan, round, project }]
    ));
    return { mode:'single-round', unitLabel:'dự án', title:'Biểu đồ từng dự án trong cuộc thanh tra', projectItems, rows };
  }
  const projectItems = reportProjectItems(usableGroups);
  if(usableGroups.length > 1){
    const rows = usableGroups.map(group=>reportProgressRow(
      'plan',
      group.plan.code || group.plan.name || 'Kế hoạch',
      `${group.rounds.length} cuộc thanh tra, ${reportProjectItems([group]).length} dự án`,
      reportProjectItems([group])
    ));
    return { mode:'plans', unitLabel:'kế hoạch', title:'Biểu đồ tổng hợp theo kế hoạch thanh tra', projectItems, rows };
  }
  const rows = usableGroups.flatMap(group=>group.rounds.map(round=>reportProgressRow(
    'round',
    round.code || round.name || 'Cuộc thanh tra',
    `${group.plan.code || group.plan.name || 'Kế hoạch'} - ${visibleProjectsForRound(round).length} dự án`,
    reportItemsForRound(group.plan, round)
  )));
  return { mode:'rounds', unitLabel:'cuộc thanh tra', title:'Biểu đồ tổng hợp theo cuộc thanh tra', projectItems, rows };
}
function renderReportProgressPanel(groups, options={}){
  const context = buildReportProgressContext(groups, options);
  reportProgressContext = context;
  const metrics = reportMetrics(context.projectItems);
  const chartHeight = Math.max(430, Math.min(560, 380 + context.rows.length * 16));
  return `<div class="card">
    <div class="section-title"><h2>Tiến độ và sai phạm/kiến nghị</h2><div class="chart-export-actions"><span class="pill">${context.rows.length} ${esc(context.unitLabel)}</span><span class="pill">${metrics.projects} dự án</span><button class="soft-btn" data-action="export-report-chart"><i class="ti ti-printer"></i>In/PDF biểu đồ</button></div></div>

    <div class="report-project-grid" style="margin-top:14px;">${context.rows.length ? context.rows.map(renderReportProgressRow).join('') : '<div class="empty">Chưa có dữ liệu để tổng hợp.</div>'}</div>

}

function renderReports(){
  const plans = visiblePlans();
  const plan = (reportPlanId ? plans.find(p=>p.id===reportPlanId) : null) || (plans[0] || null);
  if(plan && reportPlanId !== plan.id) reportPlanId = plan.id;
  const rounds = plan ? visibleRounds(plan) : [];
  const singleRound = (reportSingleRoundId ? rounds.find(r=>r.id===reportSingleRoundId) : null) || (rounds[0] || null);
  if(singleRound && reportSingleRoundId !== singleRound.id) reportSingleRoundId = singleRound.id;
  const selected = rounds.filter(r=>!reportRoundIds.size || reportRoundIds.has(r.id));
  return `<section class="grid">

function attachEvents(){
  root.querySelectorAll('[data-action]').forEach(el=>{
    const action = el.dataset.action;
    if(action === 'nav') el.onclick = ()=>{ view=el.dataset.view; selectedPlanId=''; selectedRoundId=''; selectedProjectId=''; render(); };
    if(action === 'toggle-theme') el.onclick = ()=>{ theme = theme==='dark' ? 'light' : 'dark'; localStorage.setItem(THEME_KEY, theme); render(); };
    if(action === 'signout') el.onclick = signOut;
    if(action === 'auth-mode') el.onclick = ()=>{ authMode=el.dataset.mode; authMessage=''; render(); };
    if(action === 'auth-submit') el.onclick = ()=>{
      const email=document.getElementById('authEmail').value.trim();
      const pass=document.getElementById('authPassword').value;
      const name=document.getElementById('authName')?.value.trim() || '';
      if(!email || !pass){ authMessage='Nhập đầy đủ email và mật khẩu.'; render(); return; }
      if(authMode==='signup' && pass.length < 6){ authMessage='Mật khẩu phải có tối thiểu 6 ký tự.'; render(); return; }
      authMode==='login' ? signIn(email, pass) : signUp(email, pass, name);
    };
    if(action === 'add-plan') el.onclick = addPlanFromForm;
    if(action === 'create-sample-plans') el.onclick = createSamplePlans;
    if(action === 'open-plan') el.onclick = ()=>{ selectedPlanId=el.dataset.planId; selectedRoundId=''; selectedProjectId=''; view='plans'; render(); };
    if(action === 'delete-plan') el.onclick = ()=>deletePlan(el.dataset.planId);
    if(action === 'back-plans') el.onclick = ()=>{ selectedPlanId=''; selectedRoundId=''; selectedProjectId=''; render(); };
    if(action === 'add-round') el.onclick = ()=>addRoundFromForm(el.dataset.planId);
    if(action === 'open-round') el.onclick = ()=>{ selectedPlanId=el.dataset.planId; selectedRoundId=el.dataset.roundId; selectedProjectId=''; view='plans'; render(); };
    if(action === 'delete-round') el.onclick = ()=>deleteRound(el.dataset.planId, el.dataset.roundId);
    if(action === 'back-plan') el.onclick = ()=>{ selectedPlanId=el.dataset.planId; selectedRoundId=''; selectedProjectId=''; render(); };
    if(action === 'add-project') el.onclick = ()=>addProjectFromForm(el.dataset.planId, el.dataset.roundId);
    if(action === 'open-project') el.onclick = ()=>{ selectedPlanId=el.dataset.planId; selectedRoundId=el.dataset.roundId; selectedProjectId=el.dataset.projectId; detailTab='workflow'; render(); };
    if(action === 'delete-project') el.onclick = ()=>deleteProject(el.dataset.planId, el.dataset.roundId, el.dataset.projectId);
    if(action === 'back-round') el.onclick = ()=>{ selectedPlanId=el.dataset.planId; selectedRoundId=el.dataset.roundId; selectedProjectId=''; render(); };
    if(action === 'project-tab') el.onclick = ()=>{ detailTab=el.dataset.tab; render(); };
    if(action === 'toggle-step') el.onchange = ()=>toggleStep(el);
    if(action === 'recalc-steps') el.onclick = ()=>{ const p=findProject(el.dataset.planId, el.dataset.roundId, el.dataset.projectId); if(p){ recalcProjectSteps(p); saveState(); render(); } };
    if(action === 'add-finding') el.onclick = ()=>addTextItem('finding');
    if(action === 'add-recommendation') el.onclick = ()=>addTextItem('recommendation');
    if(action === 'delete-text-item') el.onclick = ()=>deleteTextItem(el.dataset.kind, Number(el.dataset.index));
    if(action === 'add-recovery-payment') el.onclick = ()=>addRecoveryPayment(el.dataset.planId, el.dataset.roundId, el.dataset.projectId);
    if(action === 'delete-recovery-payment') el.onclick = ()=>deleteRecoveryPayment(el.dataset.planId, el.dataset.roundId, el.dataset.projectId, Number(el.dataset.paymentIndex));
    if(action === 'copy-project-report') el.onclick = ()=>copyText(document.getElementById('projectReportPreview')?.textContent || '');
    if(action === 'copy-round-report') el.onclick = ()=>copyText(document.getElementById('roundReportPreview')?.textContent || '');
    if(action === 'copy-plan-report') el.onclick = ()=>copyText(document.getElementById('planReportPreview')?.textContent || '');
    if(action === 'export-report-chart') el.onclick = exportReportChart;
    if(action === 'export-plan-word') el.onclick = exportCurrentPlanWordReport;
    if(action === 'export-round-word') el.onclick = exportCurrentRoundWordReport;
    if(action === 'export-project-word') el.onclick = ()=>exportProjectWordReport(el.dataset.planId, el.dataset.roundId, el.dataset.projectId);
    if(action === 'toggle-report-plan') el.onchange = ()=>{
      reportChartScope = 'summary';
      const plan = findPlan(el.dataset.planId);
      if(el.checked){
        reportPlanIds.add(el.dataset.planId);
        if(plan) visibleRounds(plan).forEach(round=>reportRoundIds.add(round.id));
      }else{
        reportPlanIds.delete(el.dataset.planId);
        if(plan) visibleRounds(plan).forEach(round=>reportRoundIds.delete(round.id));
      }
      render();
    };
    if(action === 'toggle-report-round') el.onchange = ()=>{ reportChartScope = 'summary'; if(el.checked) reportRoundIds.add(el.dataset.roundId); else reportRoundIds.delete(el.dataset.roundId); render(); };
    if(action === 'add-profile') el.onclick = addProfileFromForm;
    if(action === 'check-version') el.onclick = ()=>checkVersion(true);
    if(action === 'apply-version') el.onclick = applyVersionUpdate;
    if(action === 'dismiss-version') el.onclick = ()=>{ dismissedVersion = versionInfo.version || ''; render(); };
  });
  root.querySelectorAll('[data-bind]').forEach(el=>{
    const eventName = el.tagName === 'SELECT' || el.type === 'date' || el.type === 'checkbox' ? 'change' : 'input';
    el.addEventListener(eventName, ()=>updateBoundValue(el));
  });
  root.querySelectorAll('[data-multi-bind]').forEach(el=>{
    el.addEventListener('change', ()=>updateMultiEmailValue(el));
  });
  const reportSelect = document.getElementById('reportPlanSelect');
  if(reportSelect) reportSelect.onchange = ()=>{ reportChartScope = 'summary'; reportPlanId = reportSelect.value; reportSingleRoundId=''; reportRoundIds.clear(); render(); };
  const reportSinglePlanSelect = document.getElementById('reportSinglePlanSelect');
  if(reportSinglePlanSelect) reportSinglePlanSelect.onchange = ()=>{ reportChartScope = 'single-round'; reportPlanId = reportSinglePlanSelect.value; reportSingleRoundId=''; render(); };
  const reportRoundSelect = document.getElementById('reportRoundSelect');
  if(reportRoundSelect) reportRoundSelect.onchange = ()=>{ reportChartScope = 'single-round'; reportSingleRoundId = reportRoundSelect.value; render(); };
}
function addPlanFromForm(){
  if(!isChief()) return;
  const code = document.getElementById('newPlanCode').value.trim();
  const name = document.getElementById('newPlanName').value.trim();
  if(!code && !name){ alert('Nhập kế hoạch thanh tra số hoặc tên kế hoạch.'); return; }
  const p = newPlan(code, name);
  p.year = Number(document.getElementById('newPlanYear').value || new Date().getFullYear());
  p.issuedDate = document.getElementById('newPlanDate').value || today();
  state.plans.unshift(p);
  selectedPlanId = p.id;
  saveState();
  render();
}
function addRoundFromForm(planId){
  const plan = findPlan(planId);
  if(!plan || !isChief()) return;
  const code = document.getElementById('newRoundCode').value.trim();
  const name = document.getElementById('newRoundName').value.trim();
  if(!code && !name){ alert('Nhập cuộc thanh tra hoặc tên cuộc thanh tra.'); return; }
  const r = newRound(code, name, document.getElementById('newRoundDeputy').value);
  if(r.deputyEmail && !plan.deputyEmails.includes(r.deputyEmail)) plan.deputyEmails.push(r.deputyEmail);
  plan.rounds.unshift(r);
  selectedRoundId = r.id;
  saveState();
  render();
}
function addProjectFromForm(planId, roundId){
  const round = findRound(planId, roundId);
  if(!round || !canAssignProjectMembers(round)) return;
  const name = document.getElementById('newProjectName').value.trim();
  if(!name){ alert('Nhập tên dự án.'); return; }
  const memberEmails = Array.from(root.querySelectorAll(`[data-new-project-member="${round.id}"]:checked`)).map(el=>normalizeEmail(el.value)).filter(Boolean);
  const p = newProject(name, document.getElementById('newProjectUnit').value.trim(), document.getElementById('newProjectLocation').value.trim(), memberEmails);
  round.projects.unshift(p);
  selectedProjectId = p.id;
  saveState();
  render();
}
async function deletePlan(planId){
  const plan = findPlan(planId);
  if(!plan || !canDeletePlan(plan)) return;
  if(!confirm(`Xóa kế hoạch "${plan.code || plan.name}" và toàn bộ cuộc thanh tra, dự án bên trong?`)) return;
  try{
    saving = true;
    renderSaveStatus();
    await deleteRowById(TABLES.plans, plan.id);
    state.plans = state.plans.filter(p=>p.id !== plan.id);
    selectedPlanId = '';
    selectedRoundId = '';
    selectedProjectId = '';
    statusOk = true;
    statusText = 'Đã xóa kế hoạch trên Supabase.';
    await saveState({ silent:true });
  }catch(e){
    console.error(e);
    statusOk = false;
    statusText = 'Không xóa được kế hoạch trên Supabase. ' + dbErrorText(e);
  }finally{
    saving = false;
    render();
  }
}
async function deleteRound(planId, roundId){
  const plan = findPlan(planId);

  if(!plan || !round || !canDeleteRound(round)) return;

    await deleteRowById(TABLES.rounds, round.id);

    await saveState({ silent:true });

    console.error(e);
    statusOk = false;
    statusText = 'Không xóa được cuộc thanh tra trên Supabase. ' + dbErrorText(e);
  }finally{
    saving = false;
    render();
  }
}

function addProfileFromForm(){

  const existing = state.profiles.find(p=>p.id === profileId);

  if(isBootstrapAdmin() && role !== 'chief'){ alert('Tài khoản quản trị khởi tạo chỉ được gán Chánh Thanh tra.'); return; }
  if(isChief() && role === 'admin'){ alert('Không được tạo thêm tài khoản quản trị khởi tạo.'); return; }

function selectedEmailsFromPicker(el){
  return Array.from(root.querySelectorAll('[data-multi-bind]'))
    .filter(item=>
      item.dataset.multiBind === el.dataset.multiBind &&
      (item.dataset.planId || '') === (el.dataset.planId || '') &&
      (item.dataset.roundId || '') === (el.dataset.roundId || '') &&
      (item.dataset.projectId || '') === (el.dataset.projectId || '')
    )
    .filter(item=>item.checked)
    .map(item=>normalizeEmail(item.value))
    .filter(Boolean);
}
function updateMultiEmailValue(el){
  const bind = el.dataset.multiBind;
  const value = selectedEmailsFromPicker(el);
  const plan = findPlan(el.dataset.planId);
  const round = el.dataset.roundId ? findRound(el.dataset.planId, el.dataset.roundId) : null;
  const project = el.dataset.projectId ? findProject(el.dataset.planId, el.dataset.roundId, el.dataset.projectId) : null;
  if(bind === 'plan.deputyEmails' && plan && canEditPlan(plan)){
    plan.deputyEmails = value;
    saveState();
    render();
    return;
  }
  if(bind === 'round.memberEmails' && round && canAssignRoundTeam(round)){
    round.memberEmails = value;
    (round.projects || []).forEach(project=>{
      project.memberEmails = (project.memberEmails || []).filter(email=>value.includes(normalizeEmail(email)));
    });
    saveState();
    render();
    return;
  }
  if(bind === 'project.memberEmails' && project && round && canAssignProjectMembers(round)){
    project.memberEmails = value;
    saveState();
    render();
  }
}
function updateFinancialPreview(project){
  const finance = normalizeMoney(project && project.financialRecovery);
  project.financialRecovery = finance;
  root.querySelectorAll(`[data-financial-recovered-total="${project.id}"]`).forEach(input=>{
    input.value = moneyText(finance.recovered);
  });
  root.querySelectorAll(`[data-financial-remaining="${project.id}"]`).forEach(input=>{
    input.value = moneyText(remainingMoney(finance));
  });

function updateBoundValue(el){
  const bind = el.dataset.bind;
  let value = el.value;
  if(bind.endsWith('Emails')) value = splitEmails(value);
  if(bind === 'plan.year') value = Number(value || new Date().getFullYear());
  const plan = findPlan(el.dataset.planId);
  const round = el.dataset.roundId ? findRound(el.dataset.planId, el.dataset.roundId) : null;
  const project = el.dataset.projectId ? findProject(el.dataset.planId, el.dataset.roundId, el.dataset.projectId) : null;
  if(bind.startsWith('plan.') && plan && canEditPlan(plan)){ plan[bind.split('.')[1]] = value; }
  if(bind.startsWith('round.') && round){
    const field = bind.split('.')[1];
    const canUpdateRoundField =
      (field === 'deputyEmail' && isChief()) ||
      (['leaderEmail','memberEmails'].includes(field) && canAssignRoundTeam(round)) ||
      (!['deputyEmail','leaderEmail','memberEmails'].includes(field) && canEditRound(round));
    if(!canUpdateRoundField) return;
    round[field] = value;
    if(bind === 'round.deputyEmail' && plan && value && !plan.deputyEmails.includes(value)) plan.deputyEmails.push(value);
  }
  if(bind.startsWith('project.') && project && round){
    const field = bind.split('.')[1];
    if(field === 'memberEmails' && !canAssignProjectMembers(round)) return;
    if(field !== 'memberEmails' && !canEditProject(round, project)) return;
    project[field] = value;
    if(bind === 'project.complexity') recalcProjectSteps(project);
  }
  if(bind.startsWith('step.') && project && round && canEditProject(round, project)){
    const step = project.steps.find(s=>s.key===el.dataset.stepKey);
    if(step){
      step[bind.split('.')[1]] = value;
      if(bind === 'step.dueDate') step.autoDue = false;
      if(bind === 'step.completedAt' && value) step.completed = true;
      recalcProjectSteps(project);
    }
  }
  if(bind.startsWith('finding.') && project && round && canEditProject(round, project)){
    project.findings[Number(bind.split('.')[1])] = value;
  }
  if(bind.startsWith('recommendation.') && project && round && canEditProject(round, project)){
    project.recommendations[Number(bind.split('.')[1])] = value;
  }
  if(bind.startsWith('financial.') && project && round && canEditProject(round, project)){
    const field = bind.split('.')[1];
    project.financialRecovery = normalizeMoney(project.financialRecovery);
    if(field === 'required') project.financialRecovery.required = moneyNumber(value);
    updateFinancialPreview(project);
    saveState({ debounce:true, silent:true });
    return;
  }
  if(bind.startsWith('financialPayment.') && project && round && canEditProject(round, project)){
    const [, field, indexText] = bind.split('.');
    const index = Number(indexText);
    project.financialRecovery = normalizeMoney(project.financialRecovery);
    const payment = project.financialRecovery.recoveryPayments[index];
    if(!payment) return;
    payment[field] = field === 'amount' ? moneyNumber(value) : value;
    updateFinancialPreview(project);
    saveState({ debounce:true, silent:true });
    return;
  }
  if(bind.startsWith('profile.')){
    const p = state.profiles.find(x=>x.id===el.dataset.profileId);
    if(!p || !canEditProfile(p)) return;
    const field = bind.split('.')[1];
    if(field === 'role'){
      if(isBootstrapAdmin() && !['admin','chief','member'].includes(value)) return;
      if(isChief() && value === 'admin') return;
    }
    p[field] = bind.endsWith('.email') ? normalizeEmail(value) : value;
  }
  if(bind === 'profile.role'){
    saveState();
    render();
    return;
  }
  saveState({ debounce:true, silent:true });
}
function toggleStep(el){
  const project = findProject(el.dataset.planId, el.dataset.roundId, el.dataset.projectId);
  const round = findRound(el.dataset.planId, el.dataset.roundId);
  if(!project || !round || !canEditProject(round, project)) return;
  const step = project.steps.find(s=>s.key===el.dataset.stepKey);
  if(!step) return;
  step.completed = el.checked;
  step.completedAt = el.checked ? (step.completedAt || today()) : '';
  recalcProjectSteps(project);
  saveState();
  render();
}

function safeFilePart(value){
  const raw = String(value || 'bao-cao').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D');
  return raw.replace(/[^0-9a-zA-Z._-]+/g, '-').replace(/^-+|-+$/g, '').toLowerCase() || 'bao-cao';
}
function vietnameseDateLine(value=new Date()){
  const d = value instanceof Date ? value : new Date(value);
  const date = Number.isNaN(d.getTime()) ? new Date() : d;
  return `Lâm Đồng, ngày ${String(date.getDate()).padStart(2,'0')} tháng ${String(date.getMonth()+1).padStart(2,'0')} năm ${date.getFullYear()}`;
}
function reportBodyHtml(text){
  return String(text || 'Chưa có nội dung báo cáo.')
    .split(/\n\s*\n/g)
    .map(block=>{
      const lines = block.split('\n').map(line=>line.trim()).filter(Boolean);
      if(!lines.length) return '';
      const first = lines[0];
      const isHeading = lines.length === 1 && (/^(I|II|III|IV|V|VI|VII|VIII|IX|X)\./.test(first) || first === first.toUpperCase());
      if(isHeading) return `<p class="doc-heading">${esc(first)}</p>`;
      return `<p>${lines.map(esc).join('<br>')}</p>`;
    })
    .join('');
}

function importJson(e){
  if(!isChief()){ alert('Chỉ Chánh Thanh tra được nhập dữ liệu.'); return; }
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async ()=>{
    try{
      const imported = normalizeState(JSON.parse(reader.result));
      const email = currentEmail();
      const current = currentProfile();
      let importedCurrent = imported.profiles.find(p=>normalizeEmail(p.email) === email);
      if(!importedCurrent){
        imported.profiles.push({ id:current.id || currentUser.id || uid(), authUserId:currentUser.id || '', email, name:current.name || email.split('@')[0], role:'chief', createdAt:new Date().toISOString() });
      }else{
        importedCurrent.role = 'chief';
        importedCurrent.authUserId = importedCurrent.authUserId || currentUser.id || '';
      }
      state = imported;
      await clearRemoteInspectionData();
      await saveState();
      render();
    }catch(err){ alert('File JSON không hợp lệ.'); }
  };
  reader.readAsText(file, 'utf-8');
}

function readAppVersionFromHtml(html){
  const match = String(html || '').match(/const\s+APP_VERSION\s*=\s*['"]([^'"]+)['"]/);
  return match ? match[1] : '';
}
function approvedCacheName(version){
  return APPROVED_CACHE_PREFIX + String(version || APP_VERSION).replace(/[^0-9A-Za-z._-]/g, '_');
}
function responseFromHtml(html){
  return new Response(html, { headers:{ 'Content-Type':'text/html; charset=utf-8' } });
}
function isolateCachedAppScript(html){
  const text = String(html || '');
  const matches = [...text.matchAll(/<script>([\s\S]*?)<\/script>/g)];
  const last = matches[matches.length - 1];
  if(!last) return text;
  const wrapped = `<script>(()=>{\n${last[1]}\n})();<\/script>`;
  return text.slice(0, last.index) + wrapped + text.slice(last.index + last[0].length);
}
function restoreHtmlShell(html, version){
  const restoredVersion = version || readAppVersionFromHtml(html) || APP_VERSION;
  localStorage.setItem(APPROVED_VERSION_KEY, restoredVersion);
  document.open();
  document.write(isolateCachedAppScript(html));
  document.close();
  return true;
}
async function readCachedShellHtml(cacheName){
  if(!('caches' in window) || !cacheName) return null;
  const cached = await caches.open(cacheName).then(cache=>cache.match('index.html')).catch(()=>null);
  if(!cached) return null;
  const html = await cached.clone().text();
  const version = readAppVersionFromHtml(html);
  return version ? { html, version } : null;
}
async function cacheApprovedHtml(version, html){
  const shellVersion = version || readAppVersionFromHtml(html) || APP_VERSION;
  localStorage.setItem(APPROVED_VERSION_KEY, shellVersion);
  if(html) localStorage.setItem(APPROVED_HTML_KEY, html);
  if(!('caches' in window) || !html) return;
  try{
    const approvedCache = await caches.open(approvedCacheName(shellVersion));
    await approvedCache.put('index.html', responseFromHtml(html));
    const appCache = await caches.open(APP_CACHE_NAME);
    await appCache.put('index.html', responseFromHtml(html));
  }catch(e){
    console.warn(e);
  }
}
async function fetchShellHtmlForVersion(version){
  try{
    const res = await fetch('index.html?snapshot=' + Date.now(), { cache:'no-store' });
    if(res.ok){
      const html = await res.text();
      if(readAppVersionFromHtml(html) === version) return html;
    }
  }catch(e){}
  const clone = document.documentElement.cloneNode(true);
  const clonedRoot = clone.querySelector('#root');
  if(clonedRoot) clonedRoot.innerHTML = '';
  return '<!doctype html>\n' + clone.outerHTML;
}
async function rememberApprovedShellSnapshot(){
  const approvedVersion = localStorage.getItem(APPROVED_VERSION_KEY) || APP_VERSION;
  const manualSession = sessionStorage.getItem(MANUAL_UPDATE_SESSION_KEY);
  if(compareVersion(APP_VERSION, approvedVersion) > 0 && manualSession !== APP_VERSION) return;
  const html = await fetchShellHtmlForVersion(APP_VERSION);
  await cacheApprovedHtml(APP_VERSION, html);
}
async function findApprovedShellHtml(approvedVersion){
  const localHtml = localStorage.getItem(APPROVED_HTML_KEY);
  const localVersion = readAppVersionFromHtml(localHtml);
  if(localHtml && localVersion && approvedVersion && localVersion === approvedVersion){
    return { html:localHtml, version:localVersion };
  }
  if(localHtml && localVersion && !approvedVersion && compareVersion(APP_VERSION, localVersion) > 0){
    return { html:localHtml, version:localVersion };
  }
  const cacheNames = [approvedVersion ? approvedCacheName(approvedVersion) : '', APP_CACHE_NAME].filter(Boolean);
  for(const cacheName of cacheNames){
    const cached = await readCachedShellHtml(cacheName);
    if(!cached) continue;
    if(approvedVersion && cached.version === approvedVersion) return cached;
    if(!approvedVersion && compareVersion(APP_VERSION, cached.version) > 0) return cached;
  }
  return null;
}
async function restoreApprovedCachedShell(){
  const approvedVersion = localStorage.getItem(APPROVED_VERSION_KEY);
  const manualSession = sessionStorage.getItem(MANUAL_UPDATE_SESSION_KEY);
  if(manualSession === APP_VERSION) return false;
  if(approvedVersion && compareVersion(APP_VERSION, approvedVersion) > 0){
    const approved = await findApprovedShellHtml(approvedVersion);
    if(approved && compareVersion(APP_VERSION, approved.version) > 0){
      return restoreHtmlShell(approved.html, approved.version);
    }
  }
  if(!approvedVersion){
    const fallback = await findApprovedShellHtml('');
    if(fallback && compareVersion(APP_VERSION, fallback.version) > 0){
      return restoreHtmlShell(fallback.html, fallback.version);
    }
  }
  return false;
}
async function guardManualUpdateThenInit(){
  try{
    const restored = await restoreApprovedCachedShell();
    if(restored) return;
    if(!localStorage.getItem(APPROVED_VERSION_KEY)){
      localStorage.setItem(APPROVED_VERSION_KEY, APP_VERSION);
    }
  }catch(e){
    console.warn(e);
  }
  await init();
  try{ await rememberApprovedShellSnapshot(); }catch(e){ console.warn(e); }
}
async function registerServiceWorker(){
  if(!('serviceWorker' in navigator) || location.protocol === 'file:') return;
  try{ await navigator.serviceWorker.register(APP_UPDATE_SW_URL); }catch(e){ console.warn(e); }
}
async function checkVersion(force=false){
  try{
    const res = await fetch(VERSION_MANIFEST_URL + '?t=' + Date.now(), { cache:'no-store' });
    if(!res.ok) return;
    const manifest = await res.json();
    versionInfo = { available: compareVersion(manifest.version || APP_VERSION, APP_VERSION) > 0, version:manifest.version || APP_VERSION, notes:manifest.notes || '', checked:true };
    if(force || !versionInfo.available) dismissedVersion = '';
    if(force || versionInfo.available) render();
  }catch(e){ if(force) alert('Không kiểm tra được version.json.'); }
}
function startVersionMonitor(){
  clearInterval(versionCheckTimer);
  versionCheckTimer = setInterval(()=>checkVersion(false), 5 * 60 * 1000);
}
function wait(ms){ return new Promise(resolve=>setTimeout(resolve, ms)); }
async function setUpdateProgress(progress, message){
  updateInProgress = true;
  updateProgress = progress;
  updateMessage = message;
  render();
  await wait(180);
}
function updateAppShellThroughServiceWorker(){
  return new Promise(resolve=>{
    if(!('serviceWorker' in navigator)){
      resolve(false);
      return;
    }
    const worker = navigator.serviceWorker.controller;
    if(!worker){
      resolve(false);
      return;
    }
    const done = event=>{
      if(!event.data || !['APP_SHELL_UPDATED','APP_SHELL_UPDATE_FAILED'].includes(event.data.type)) return;
      navigator.serviceWorker.removeEventListener('message', done);
      resolve(event.data.type === 'APP_SHELL_UPDATED');
    };
    navigator.serviceWorker.addEventListener('message', done);
    worker.postMessage({ type:'UPDATE_APP_SHELL' });
    setTimeout(()=>{
      navigator.serviceWorker.removeEventListener('message', done);
      resolve(false);
    }, 9000);
  });
}
async function updateAppShellFromPage(preloadedHtml='', stamp=Date.now()){
  if(!('caches' in window)) return false;
  const cache = await caches.open(APP_CACHE_NAME);
  let html = preloadedHtml;
  if(!html){
    const indexRes = await fetch('index.html?update=' + stamp, { cache:'no-store' });
    if(!indexRes.ok) throw new Error('Không tải được index.html mới.');
    html = await indexRes.text();
  }
  await cache.put('index.html', responseFromHtml(html));
  const versionRes = await fetch(VERSION_MANIFEST_URL + '?update=' + stamp, { cache:'no-store' });
  if(versionRes.ok) await cache.put(VERSION_MANIFEST_URL, versionRes.clone());
  return true;
}
async function applyVersionUpdate(){
  await checkVersion(true);
  if(!versionInfo.available){
    alert('Chưa có bản cập nhật mới.');
    return;
  }
  const ok = confirm(`Có bản cập nhật ${versionInfo.version}. Có muốn cập nhật bây giờ không?`);
  if(!ok) return;
  try{
    await setUpdateProgress(0, 'Bắt đầu cập nhật...');
    await setUpdateProgress(18, 'Đang kiểm tra gói phiên bản...');
    const stamp = Date.now();
    await fetch(VERSION_MANIFEST_URL + '?update=' + stamp, { cache:'no-store' });
    await setUpdateProgress(38, 'Đang tải giao diện mới...');
    const indexRes = await fetch('index.html?update=' + stamp, { cache:'no-store' });
    if(!indexRes.ok) throw new Error('Không tải được index.html mới.');
    const newHtml = await indexRes.text();
    const newVersion = readAppVersionFromHtml(newHtml) || versionInfo.version || APP_VERSION;
    if(compareVersion(newVersion, APP_VERSION) <= 0) throw new Error(`index.html trên server đang là bản ${newVersion || 'không đọc được'}, app hiện tại là ${APP_VERSION}, version.json báo ${versionInfo.version}. Hãy deploy lại đủ index.html, version.json và sw.js.`);
    await setUpdateProgress(68, 'Đang ghi cache phiên bản mới...');
    const workerUpdated = await updateAppShellThroughServiceWorker();
    if(!workerUpdated) await updateAppShellFromPage(newHtml, stamp);
    await setUpdateProgress(92, 'Đang hoàn tất cập nhật...');
    await setUpdateProgress(100, 'Cập nhật hoàn tất. Đang mở lại phiên bản mới...');
    await cacheApprovedHtml(newVersion, newHtml);
    sessionStorage.setItem(MANUAL_UPDATE_SESSION_KEY, newVersion);
    await wait(650);
    location.reload();
  }catch(e){
    console.error(e);
    updateInProgress = false;
    updateProgress = 0;
    updateMessage = '';
    alert('Cập nhật thất bại: ' + (e.message || 'kiểm tra lại kết nối mạng.'));
    render();
  }
}
function compareVersion(a,b){
  const pa=String(a).split('.').map(Number), pb=String(b).split('.').map(Number);
  for(let i=0;i<3;i++){ const x=pa[i]||0, y=pb[i]||0; if(x!==y) return x-y; }
  return 0;
}

guardManualUpdateThenInit();
